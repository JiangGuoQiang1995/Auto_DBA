{% extends "base.html" %}
{% load staticfiles %}
{% block title %}
{{EventName}}
{% endblock %}
{% block content %}
<link href="{% static 'css/event.css' %}" rel="stylesheet">
<!-- 主体内容 -->
<div class="main-content d-flex flex-column min-vh-100">
    <div class="container">
        <div class="row row-3">
            <div class="model-details-title">
                {{EventName}}
                <div class="col-md-7 hidden-xs model-details-title-search">
                    <form method="get" action="/search/">
                        {% csrf_token %}
                        <div class="input-group">
                            <input type="text" name="keyword" class="form-control" placeholder="请输入关键词" required />
                            <span class="input-group-btn">
                                <input type="submit" class="btn btn-default" value="查询" />
                            </span>
                        </div>
                    </form>
                </div>
            </div>
            <div class="model-details">
                {% for myevent in eventList %}
                <div class="news-model">
                    <a href="{% url 'event_logs:EventDetail' myevent.event_id %}"><b>{{myevent.event_title}}</b></a>
                    <span>【{{myevent.event_time|date:"Y-m-d"}}】</span>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

{% endblock %}
