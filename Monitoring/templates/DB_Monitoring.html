{% extends "base.html" %}
{% load static %}

{% block title %}
监控中心-数据库监控
{% endblock %}

{% block content %}
<style>
    .canvas {
        position: fixed;
        left: 240px;
        width: 100%;
        height: 100%;
    }
    .quarter-div {
        position: absolute;
        width: 42%;
        height: 42%;
    }
    .top-left {
        top: 120px;
        left: 240px;
    }
    .top-right {
        top: 120px;
        right: 0;
    }
    .bottom-left {
        bottom: 0;
        left: 240px;
    }
    .bottom-right {
        bottom: 0;
        right: 0;
    }
</style>
<div id="container" class=" main-content">
    <!--主体内容-->
    <div class="container mt-5">
        <!--画布：用于绘制数据可视化图表-->
        <canvas class="canvas" width="800" height="800"></canvas>
        <div id="my_line" class="chart-container quarter-div top-left" title="DB Connections"></div>
        <div id="my_pie" class="chart-container quarter-div top-right"></div>
        <div id="my_bar" class="chart-container quarter-div bottom-left"title="工单完成量"></div>
        <div id="my_radar" class="chart-container quarter-div bottom-right"></div>
        <script>
            //折线图
            var lineChart = echarts.init(document.getElementById('my_line'));
            var lineOption = {
                title: {
                    text: 'RDS 连接数'
                },
                xAxis: {
                    data: ['2025-01','2025-02','2025-03','2025-04','2025-05','2025-06']
                },
                yAxis: {},
                series: [{
                    type: 'line',
                    data: [47,123,117,80,157,201]
                }]
            };
            lineChart.setOption(lineOption);
            //饼状图
            var pieChart = echarts.init(document.getElementById('my_pie'));
            var pieOption = {
                title: {
                    text: '工作内容分布'
                },
                tootip: {},
                series: [{
                    type: 'pie',
                    radius: '55%',
                    data: [
                        {value: 335, name: 'PostgreSQL'},
                        {value: 310, name: 'Redis'},
                        {value: 234, name: 'Cassandra'},
                        {value: 135, name: 'MongoDB'},
                        {value: 1548, name: 'MySQL'},
                    ]
                }]
            };
            pieChart.setOption(pieOption);
            //柱状图
            var barChart = echarts.init(document.getElementById('my_bar'));
            var barOption = {
                title: {
                    text: '业务组内工单完成量'
                },
                xAxis: {
                    data: ['Mon', 'TUe', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
                },
                yAxis: {},
                series: [{
                    type: 'bar',
                    data: [120, 200, 150, 80, 75, 110, 130]
                }]
            };
            barChart.setOption(barOption);
            //混合图
			var radarchartDom = document.getElementById('my_radar');
			var radarChart = echarts.init(radarchartDom);
			var option;
			
			option = {
			title: {
				text: '费用分析'
			},
			legend: {},
			radar: [
				{
				indicator: [
					{ text: 'EC2' },
					{ text: 'EKS' },
					{ text: 'RDS MySQL' },
					{ text: 'Cloudwatch' },
					{ text: 'S3' }
				],
				center: ['50%', '55%'],
				radius: 120,
				startAngle: 90,
				splitNumber: 4,
				shape: 'circle',
				axisName: {
					formatter: '【{value}】',
					color: '#428BD4'
				},
				splitArea: {
					areaStyle: {
					color: ['#77EADF', '#26C3BE', '#64AFE9', '#428BD4'],
					shadowColor: 'rgba(0, 0, 0, 0.2)',
					shadowBlur: 10
					}
				},
				axisLine: {
					lineStyle: {
					color: 'rgba(211, 253, 250, 0.8)'
					}
				},
				splitLine: {
					lineStyle: {
					color: 'rgba(211, 253, 250, 0.8)'
					}
				}
				}
			],
			series: [
				{
				type: 'radar',
				emphasis: {
					lineStyle: {
					width: 4
					}
				},
				data: [
					{
					value: [100, 8, 0.4, -80, 2000],
					name: '上月费用'
					},
					{
					value: [60, 5, 0.3, -100, 1500],
					name: '本月费用',
					areaStyle: {
						color: 'rgba(255, 228, 52, 0.6)'
					}
					}
				]
				}
			]
			};
			
			option && radarChart.setOption(option);
        </script> 
    </div>
</div>

{% endblock %}
